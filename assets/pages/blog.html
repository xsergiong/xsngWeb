<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../src/styles/main.css">
    <link rel="stylesheet" href="../../src/styles/blog.css">
    <link rel="stylesheet" href="../../src/styles/stars.css">
    <title>Blog</title>
</head>
<body>
    <header>
        <h1 id="title">xsergiong</h1>
    </header>
    
    <main></main>

    <style>
        #blog-section{
            width: 78%;
            height: fit-content;
        }
        #blog{
            width: 74.5%;
            margin-right: 0.5%;
        }
        .blog-entry{
            width: 91%;
        }
    </style>

    <script type="module">
        import LoadBlog from "../../src/components/Blog.js";
        import LoadStars from "../../src/components/Stars.js";
        import BlockMobileAndTablet from "../../src/components/Blocker.js";

        function Load(){
            if (BlockMobileAndTablet())
                return;
            LoadBlog(
                document.querySelector('main'),
                '../json/blog-entries.json'
            );
            LoadStars(
                document.querySelector('#blog-section'),
                [
                    7,
                    5
                ],
                [
                    'Home',
                    'Blog'
                ],
                [
                    '../../index.html',
                    '#'
                ]
            );
        }

        Load();
    </script>
</body>
</html>
